{% extends "base.html" %}
{% block title %}Log Activity — Sathgen BD CRM{% endblock %}
{% block content %}
<div class="page-header">
  <div class="breadcrumb"><a href="/activities">Activities</a> / <span>New Activity</span></div>
  <h1>Log Activity</h1>
</div>

<div class="card form-card">
  <form method="post" action="{{ action }}">
    <div class="form-grid-2">
      <div class="form-group">
        <label class="form-label">Date <span class="required">*</span></label>
        <input type="date" name="activity_date" value="{{ activity.activity_date if activity else today }}" class="form-control" required>
      </div>
      <div class="form-group">
        <label class="form-label">Activity Type</label>
        <select name="activity_type" class="form-select">
          {% for val in ['email','call','meeting','linkedin','conference','intro','data_room','note'] %}
          <option value="{{ val }}" {% if activity and activity.activity_type == val %}selected{% elif not activity and val == 'email' %}selected{% endif %}>{{ val | title }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Company</label>
        <select name="company_id" class="form-select" id="act-company-select">
          <option value="">— Select Company —</option>
          {% for c in companies %}
          <option value="{{ c.id }}"
            {% if activity and activity.company_id == c.id %}selected
            {% elif not activity and preset_company_id == c.id|string %}selected
            {% endif %}>{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Contact</label>
        <select name="contact_id" class="form-select" id="act-contact-select">
          <option value="">— Select Contact —</option>
          {% for c in contacts %}
          <option value="{{ c.id }}"
            {% if activity and activity.contact_id == c.id %}selected
            {% elif not activity and preset_contact_id == c.id|string %}selected
            {% endif %}>{{ c.first_name }} {{ c.last_name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Opportunity</label>
        <select name="opportunity_id" class="form-select">
          <option value="">— Link to Opportunity —</option>
          {% for o in opportunities %}
          <option value="{{ o.id }}"
            {% if activity and activity.opportunity_id == o.id %}selected
            {% elif not activity and preset_opportunity_id == o.id|string %}selected
            {% endif %}>{{ o.name }} ({{ o.company_name or '?' }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Sentiment</label>
        <select name="sentiment" class="form-select">
          {% for val, label in [('very_positive','Very Positive'),('positive','Positive'),('neutral','Neutral'),('negative','Negative'),('very_negative','Very Negative')] %}
          <option value="{{ val }}" {% if activity and activity.sentiment == val %}selected{% elif not activity and val == 'neutral' %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Owner</label>
        <input type="text" name="owner" value="{{ activity.owner if activity else '' }}" class="form-control">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Subject</label>
      <input type="text" name="subject" value="{{ activity.subject if activity else '' }}" class="form-control" placeholder="Brief subject line">
    </div>
    <div class="form-group">
      <label class="form-label">Summary</label>
      <textarea name="summary" class="form-control" rows="6" placeholder="Detailed notes from this interaction…">{{ activity.summary if activity else '' }}</textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Documents Shared</label>
      <input type="text" name="documents_shared" value="{{ activity.documents_shared if activity else '' }}" class="form-control" placeholder="e.g. Pitch Deck v2, NDA">
    </div>
    <div class="form-group">
      <label class="form-label">Action Items</label>
      <textarea name="action_items" class="form-control" rows="3" placeholder="Follow-up actions required…">{{ activity.action_items if activity else '' }}</textarea>
    </div>
    <div class="form-group">
      <label class="form-label checkbox-label">
        <input type="checkbox" name="follow_up_required" id="follow-up-checkbox" value="1" {% if activity and activity.follow_up_required %}checked{% endif %}>
        Create Follow-up Reminder
      </label>
    </div>
    <div id="followup-fields" class="form-grid-2 {% if not activity or not activity.follow_up_required %}hidden{% endif %}">
      <div class="form-group">
        <label class="form-label">Follow-up Date</label>
        <input type="date" name="follow_up_date" value="{{ activity.follow_up_date if activity else '' }}" class="form-control">
      </div>
      <div class="form-group">
        <label class="form-label">Follow-up Priority</label>
        <select name="follow_up_priority" class="form-select">
          {% for val in ['urgent','high','medium','low'] %}
          <option value="{{ val }}" {% if val == 'medium' %}selected{% endif %}>{{ val | title }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Log Activity</button>
      <a href="/activities" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
